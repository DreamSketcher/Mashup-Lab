[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mashup-lab"
version = "0.1.0.dev0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "numpy>=1.26,<3", "soundfile>=0.12.1,<1"]

[project.optional-dependencies]
gui = [
  "PySide6==6.8.3; python_version < '3.14'",
  "PySide6==6.10.3; python_version >= '3.14'",
]

[tool.setuptools.packages.find]
include = ["mashup*"]
