name: GUI smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-gui.txt
      - name: Verify Qt can be imported (do not silently skip)
        run: python -c "from PySide6.QtWidgets import QApplication; from mashup.gui import MashupWindow"
      - name: GUI smoke tests
        run: python -m unittest discover -s tests -p test_gui.py -v
