name: GUI smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libopengl0 libegl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements-gui.txt
      - name: GUI smoke tests (Qt import required)
        run: python scripts/test-gui-ci.py
      - name: Windows launcher GUI installation on Python 3.14
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        run: python tests/windows/run_ci.py tests/windows/test_gui_install.py
