name: Source separation CPU checks
on:
  push:
    paths:
      - 'mashup/separation.py'
      - 'mashup/model_store.py'
      - 'requirements-separation.txt'
      - 'scripts/separation-real-probe.py'
      - '.github/workflows/separation-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download model and print hash
        shell: pwsh
        run: |
          $url = 'https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Inst_HQ_3.onnx'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/model.onnx"
          $hash = (Get-FileHash "$env:RUNNER_TEMP/model.onnx" -Algorithm SHA256).Hash.ToLower()
          Write-Host "::notice title=UVR model SHA256::$hash"
      - name: Install engine candidate
        run: python scripts/separation-dependency-probe.py 0.41.1
      - name: Run actual inference
        run: python scripts/run-annotated.py scripts/separation-real-probe.py
