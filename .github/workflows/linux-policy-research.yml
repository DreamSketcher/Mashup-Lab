name: Linux policy snapshot research
on:
  workflow_dispatch:
  push:
    branches:
      - arena/32514431-mashup-lab
permissions:
  contents: read
jobs:
  experiments:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-policy-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect environment and run isolated probes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/policy-research-artifact"
          bash scripts/linux-policy-experiments/run.sh "$RUNNER_TEMP/policy-research-artifact"
      - name: Publish probe status annotations
        if: always()
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/policy-research-artifact"
          if [ -f "$artifact/status.tsv" ]; then
            statuses=$(awk -F '\t' 'NR>1 {printf "%s=%s; ", $1, $2}' "$artifact/status.tsv")
            printf '::notice title=Linux probe summary::%s\n' "$statuses"
          else
            echo '::warning title=Linux research::No status report was produced'
          fi
          for probe in lock_swap lock_permissions lock_coordination lock_crash; do
            if [ -f "$artifact/$probe.log" ]; then
              detail=$(tail -n 1 "$artifact/$probe.log")
              printf '::notice title=Lock detail %s::%s\n' "$probe" "$detail"
            fi
          done
          if [ -f "$artifact/kernel.log" ]; then
            kernel=$(head -n 1 "$artifact/kernel.log")
            printf '::notice title=Runner kernel::%s\n' "$kernel"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-policy-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/policy-research-artifact/
          if-no-files-found: error
          retention-days: 14
