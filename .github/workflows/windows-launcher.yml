name: Windows launcher
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test prerequisite
        run: python -m pip install -r requirements.txt
      - name: Test launcher end-to-end
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/windows/run_ci.py
  incompatible-python:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify actual Python 3.10 is rejected
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/windows/test_old_python.py
